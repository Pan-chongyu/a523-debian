[Unit]
Description=TZX qualified 1416/1800MHz performance before graphical startup
ConditionKernelVersion=7.3.3-tzx-a523-accel1
ConditionPathExists=/var/lib/tzx/cpu-full-qualified.json
ConditionPathExists=/var/lib/tzx/gpu-qualified
Requires=tzx-thermal.service tzx-early-performance-check.service
After=tzx-thermal.service tzx-early-performance-check.service
Before=tzx-gpu.service lightdm.service

[Service]
Type=notify
NotifyAccess=main
ExecStart=/usr/bin/python3 -u /usr/local/lib/tzx-cpu-full/runtime.py run
ExecStopPost=/usr/bin/python3 -u /usr/local/lib/tzx-cpu-full/runtime.py restore
TimeoutStartSec=45
TimeoutStopSec=70
Restart=no

[Install]
WantedBy=graphical.target
