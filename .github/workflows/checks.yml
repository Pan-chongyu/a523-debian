name: Installer checks
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q flasher image tools packaging flash_gui.py
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r packaging/requirements-windows.txt
      - run: python packaging/build_windows.py
      - name: Check the actual frozen runtime without USB access
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/windows/A523-Debian-Flasher-v0.2.0-Windows-x64.exe
          $report = Join-Path $PWD frozen-check.json
          $process = Start-Process -FilePath $exe -ArgumentList @('--dependency-check','--report',('"'+$report+'"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen runtime check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.success -or -not $result.python_bundled -or -not $result.libusb_backend -or $result.usb_opened -or $result.disk_written) { throw 'Invalid frozen runtime report' }
      - uses: actions/upload-artifact@v4
        with:
          name: A523-Debian-Flasher-Windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.json
            dist/windows/WINDOWS-NOTICES.txt
            frozen-check.json
