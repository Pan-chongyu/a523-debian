Section "Monitor"
    Identifier "DSI-1"
    Option "PreferredMode" "800x1280"
    Option "Rotate" "right"
    Option "Primary" "true"
EndSection

Section "InputClass"
    Identifier "TZX GSL3670 right landscape"
    MatchProduct "TZX GSL3670 candidate"
    MatchIsTouchscreen "on"
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
